version: 2

models:
  - name: dim_customers
    description: "Customer dimension containing the latest customer address and lifetime purchase metrics."
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "first_purchase_date <= last_purchase_date"

      - dbt_utils.expression_is_true:
          arguments:
            expression: "lifetime_order_count >= 1 and lifetime_revenue >= 0"
          config:
            where: "first_purchase_date is not null"

      - dbt_utils.expression_is_true:
          arguments:
            expression: "lifetime_order_count = 0 and lifetime_revenue = 0"
          config:
            where: "first_purchase_date is null"

    columns:
      - name: customer_unique_id
        description: "Business key identifying a customer."
        tests:
          - unique
          - not_null

      - name: customer_zip_code_prefix
        description: "The 5-digit zip code from the customer's most recent purchase or from the customer address stored if no order has been placed."
        tests:
          - not_null

      - name: customer_city
        description: "The city from the customer's most recent purchase or from the customer address stored if no order has been placed."

      - name: customer_state
        description: "The 2-letter uppercase abbreviation of the Brazilian state (e.g., SP, RJ, MG) from the customer's most recent purchase or from the customer address stored if no order has been placed."
        tests:
          - accepted_values:
              arguments:
                values: ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"]

      - name: first_purchase_date
        description: "The timestamp of the earliest order purchase made by this customer. If it is null, the customer has not placed any order yet."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                max_value: "current_date"
                inclusive: false

      - name: last_purchase_date
        description: "The timestamp of the most recent order purchase made by this customer. If it is null, the customer has not placed any order yet."          
        tests:
          - dbt_utils.accepted_range:
              arguments:
                max_value: "current_date"
                inclusive: false

      - name: lifetime_revenue
        description: "The total accumulated monetary value of all orders placed by this customer, including both product revenue and freight fee"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: lifetime_order_count
        description: "The total distinct count of orders placed by this customer."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true