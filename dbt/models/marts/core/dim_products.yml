version: 2

models:
  - name: dim_products
    description: "Product dimension including product category name, product name and description length, product photo count, product dimensions, and weight."

    columns:
      - name: product_id
        description: "Unique identifier for a product, serving as the primary key."
        tests:
          - not_null
          - unique

      - name: product_category_name
        description: "The root category of product, translated from Portuguese into English."
        tests:
          - not_null:
              config:
                warn_if: ">500"
                error_if: ">1000"

      - name: product_name_length
        description: "The number of characters extracted from the product name."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                  
      - name: product_description_length
        description: "The number of characters extracted from the product description."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: product_photos_qty
        description: "The number of product published photos."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: product_weight_g
        description: "The product weight measured in grams."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: product_length_cm
        description: "The product length measured in centimeters."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: product_height_cm
        description: "The product height measured in centimeters."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: product_width_cm
        description: "The product width measured in centimeters"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true