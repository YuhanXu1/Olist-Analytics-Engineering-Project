version: 2

models:
  - name: stg_customers
    description: "Staging model for Olist customer data. Standardizes zip code formatting and trims whitespace from string fields."

    columns:
      - name: customer_id
        description: "Primary key of this staging model. Identifier representing the customer within a single order. The same person may have multiple customer_id values across different orders."
        tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: "The unique identifier of a customer. Ties multiple order-level customer_ids back to a single human buyer."
        tests:
          - not_null

      - name: customer_zip_code_prefix
        description: "The 5-digit zip code prefix of the customer's shipping address. Padded with leading zeros."
        tests:
          - not_null

      - name: customer_city
        description: "The city name of the buyer's shipping address. Leading and trailing whitespace has been removed."

      - name: customer_state
        description: "The 2-letter uppercase abbreviation of the Brazilian state (e.g., SP, RJ, MG)."
        tests:
          - accepted_values:
              arguments:
                values: ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"]
