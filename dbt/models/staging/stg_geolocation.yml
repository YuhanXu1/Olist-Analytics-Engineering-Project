version: 2

models:
  - name: stg_geolocation
    description: "Staging model for Olist geolocation data. Standardizes zip code formatting and trims whitespace from string fields."

    columns:
      - name: geolocation_zip_code_prefix
        description: "The 5-digit zip code prefix of the geolocation."
        tests:
          - not_null

      - name: geolocation_latitude
        description: "The latitude of the geolocation."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -90
                max_value: 90
      
      - name: geolocation_longitude
        description: "The longitude of the geolocation."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -180
                max_value: 180

      - name: geolocation_city
        description: "The city name of the gelocation. Leading and trailing whitespace has been removed."
        tests:
          - not_null

      - name: geolocation_state
        description: "The 2-letter uppercase abbreviation of the Brazilian state (e.g., SP, RJ, MG)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"]